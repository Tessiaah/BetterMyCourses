<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterMyCourses</title>
  </head>
  <body>
    <main>
      <header>
        <h1>BetterMyCourses</h1>
        <p>A calmer MyCourses.</p>
      </header>
      <div class="setting">
        <div>
          <label id="theme-label" for="enabled">Dark theme</label>
          <p id="theme-description">Inky Black</p>
        </div>
        <button
          id="enabled"
          type="button"
          role="switch"
          aria-checked="false"
          aria-labelledby="theme-label"
          aria-describedby="theme-description"
          disabled
        >
          <span id="switch-text">Off</span
          ><span class="track" aria-hidden="true"><span></span></span>
        </button>
      </div>
      <div class="setting">
        <div>
          <label id="study-assist-label" for="study-assist">Study Assist</label>
          <p id="study-assist-description">
            Drawing tools and a searchable personal formula library.
          </p>
        </div>
        <button
          id="study-assist"
          type="button"
          role="switch"
          aria-checked="false"
          aria-labelledby="study-assist-label"
          aria-describedby="study-assist-description"
          disabled
        >
          <span id="study-assist-text">Off</span>
          <span class="track" aria-hidden="true"><span></span></span>
        </button>
      </div>
      <section class="link-setting" aria-labelledby="link-label">
        <label id="link-label" for="link-color">Link color</label>
        <div class="color-controls">
          <button type="button" class="preset" data-color="#d8c3a0">
            Champagne
          </button>
          <button type="button" class="preset" data-color="#eeeae2">
            Ivory
          </button>
          <button type="button" class="preset" data-color="#a8c7b5">
            Sage
          </button>
          <input
            id="link-color"
            type="color"
            value="#d8c3a0"
            aria-label="Custom link color"
            disabled
          />
        </div>
        <p>Dark colors are adjusted for readability.</p>
      </section>
      <details class="banner-settings">
        <summary>Page banners</summary>
        <button id="banner-editor" type="button">Open banner editor</button>
        <fieldset data-banner-page="home">
          <legend>Home</legend>
          <label for="home-banner-mode">Appearance</label>
          <select id="home-banner-mode" disabled>
            <option value="original">Original image</option>
            <option value="custom">My image</option>
            <option value="plain">Plain black</option>
          </select>
          <img class="banner-preview" alt="Home banner preview" hidden />
          <label class="upload-button" for="home-banner-file"
            >Choose image</label
          >
          <input
            id="home-banner-file"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            disabled
          />
          <button type="button" class="banner-reset" disabled>
            Reset Home banner
          </button>
        </fieldset>
        <fieldset data-banner-page="dashboard">
          <legend>Dashboard</legend>
          <label for="dashboard-banner-mode">Appearance</label>
          <select id="dashboard-banner-mode" disabled>
            <option value="original">Original image</option>
            <option value="custom">My image</option>
            <option value="plain">Plain black</option>
          </select>
          <img class="banner-preview" alt="Dashboard banner preview" hidden />
          <label class="upload-button" for="dashboard-banner-file"
            >Choose image</label
          >
          <input
            id="dashboard-banner-file"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            disabled
          />
          <button type="button" class="banner-reset" disabled>
            Reset Dashboard banner
          </button>
        </fieldset>
        <p id="banner-status" role="status" aria-live="polite">
          Images stay on this device. PNG, JPEG or WebP, up to 10 MB.
        </p>
      </details>
      <p id="status" role="status" aria-live="polite">Loading preference...</p>
      <footer>Only on mycourses.aalto.fi</footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
